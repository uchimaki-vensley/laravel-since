# 依存更新の運用は docs/dependency-updates.md を参照。
# - groups: minor / patch はエコシステムごとに 1 つの PR にまとめる（major は依存ごとに個別の PR）
# - cooldown: 公開から 7 日たった版だけを取り込む（公開直後に差し替えられた悪意ある版を避ける）。
#   セキュリティアップデートには cooldown も groups も効かず、すぐ個別の PR になる
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types: [minor, patch]
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      composer:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]
  # deploy.yml が使う wrangler（deploy/package-lock.json）
  - package-ecosystem: npm
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      deploy:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        update-types: [minor, patch]
